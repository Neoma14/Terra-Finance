services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: konsultan
      POSTGRES_PASSWORD: konsultan
      POSTGRES_DB: konsultan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konsultan -d konsultan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
